name = "cutout"
main = "worker-shim.mjs"
compatibility_date = "2024-01-01"

[build]
command = "./scripts/build-worker.sh"

# ============================================================================
# Static assets served directly by Cloudflare's edge and NOT by the Worker:
# the Elm bundle (app.js), its initialiser (boot.js), the CSS modules and the
# brand mark. A request matching a file here is answered from the edge, which
# is why they can't carry a per-response header (see `public/_headers`).
#
# Anything not matching a file — /manage, /manage/pending, /inbox, /api/* —
# falls through to the Worker.
# ============================================================================
[assets]
directory = "./public"

# ============================================================================
# D1 database for routing config and pending dispatches.
# Forks: replace `database_id` with your own from `wrangler d1 create`.
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "cutout-db"
database_id = "2d32c0f5-f9c1-4b47-a275-c5a896d272b5"

# ============================================================================
# KV namespace for routing config (aliases → destination mappings).
# `id` bound via dashboard / Deploy button.
# ============================================================================
[[kv_namespaces]]
binding = "KV"

# ============================================================================
# Outbound email. The EMAIL binding is used for both send paths:
#
#   proxy (default)    Re-originates the message via `send_email`. Cloudflare
#                      Email Service must be onboarded for the sending
#                      domain, and it requires `From` to be on that domain —
#                      so the address becomes the alias, with the original
#                      sender in the display name and X-Original-From.
#                      Reply-To routes replies back through Cutout.
#
#   direct (opt-in)    Uses Email Routing's native `EmailMessage.forward()`,
#                      preserving the original From/Reply-To and the raw
#                      message. Free, but only delivers to destination
#                      addresses verified in the dashboard (Email > Email
#                      Routing > Destination Addresses). Falls back to
#                      `send_email` when the destination is unverified; that
#                      fallback uses the alias as From, so verify the
#                      destination if From must stay intact.
#
# The binding is the same either way; the choice is per destination.
# ============================================================================
[[send_email]]
name = "EMAIL"

# ============================================================================
# R2 bucket for raw email bytes: pending retries (`pending/<id>`) and
# Store action persistence (`messages/<id>`). Successful synchronous
# forwards do not touch R2.
# ============================================================================
[[r2_buckets]]
binding = "EMAILS"
bucket_name = "cutout-emails"

# ============================================================================
# Cloudflare Queues: retry pipeline for failed dispatches.
#  - `cutout-retries` carries `{id}` payloads pointing at a pending_dispatches
#    row; same script consumes it.
#  - `cutout-retries-dlq` receives messages that exhausted retries; the same
#    script's queue handler dispatches by queue name into the DLQ branch,
#    which sends an RFC 3464 DSN to the original sender and marks the row
#    dead-lettered.
# ============================================================================
[[queues.producers]]
binding = "RETRIES"
queue   = "cutout-retries"

[[queues.consumers]]
queue              = "cutout-retries"
max_batch_size     = 5
max_batch_timeout  = 10
max_retries        = 8
dead_letter_queue  = "cutout-retries-dlq"

[[queues.consumers]]
queue          = "cutout-retries-dlq"
max_batch_size = 5

# ============================================================================
# Analytics Engine dataset for aggregated stats (forwarded/dropped 7d,
# per-rule matches, top senders). Optional: if the dataset isn't created
# the worker silently skips writes and the dashboard hides stats.
# ============================================================================
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "cutout_events"

[vars]
ENVIRONMENT = "production"

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Per-deployment configuration
# ============================================================================
# Everything below is managed in the Cloudflare dashboard (Workers → cutout →
# Settings → Variables and Secrets), not in this file, so it stays portable
# for forks. The split matters:
#
# Secrets (Settings → Secrets) are encrypted and survive every deploy:
#   CF_ACCESS_TEAM    Cloudflare Access team name (e.g. "myteam")
#   CF_ACCESS_AUD     Application Audience (AUD) tag from Access app
#   CF_API_TOKEN      Cloudflare API token. "Account Analytics: Read" enables
#                     dashboard stats; "Browser Rendering: Edit" enables the
#                     in-chat screenshot for Telegram/Discord. Same token
#                     covers both. Empty disables both.
#   VIEWER_HMAC_KEY   Signs public token-mode viewer URLs; required only when
#                     a chat destination uses link auth `token`.
#
# Plain-text values are NOT durable: `wrangler deploy` rewrites the Worker's
# variables from this file, so a value set only as a dashboard Variable is
# dropped on the next build. Pass anything here that must persist with --var
# on the Builds deploy command (it overrides this file on every deploy) — or
# store it as a Secret, which survives redeploys. Setting CF_ACCOUNT_ID as a
# Secret is fine; the Worker reads secrets and variables the same way.
#   CF_ACCOUNT_ID     Cloudflare account ID. Required for the Analytics Engine
#                     SQL API (dashboard stats) and Browser Rendering (in-chat
#                     screenshots); without it both features are off. The
#                     stats panels stay hidden unless this AND CF_API_TOKEN
#                     are set.
#   PUBLIC_BASE_URL   Public origin used for inbox links in Telegram/Discord
#                     posts (e.g. "https://cutout.example.com"). Empty
#                     suppresses the link.
#
# Example Builds deploy command that keeps the readable values durable:
#   npm run deploy -- --var CF_ACCOUNT_ID:<account-id> \
#                     --var PUBLIC_BASE_URL:https://cutout.example.com
