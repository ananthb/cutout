name = "cutout"
main = "worker-shim.mjs"
compatibility_date = "2024-01-01"

[build]
command = "worker-build --release"

# ============================================================================
# D1 database for routing config and pending dispatches.
# `database_id` is intentionally omitted — bind via the Cloudflare dashboard
# (Workers → cutout → Settings → Bindings) or let the "Deploy to Cloudflare"
# button auto-provision it on first deploy.
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "cutout-db"

# ============================================================================
# KV namespace for routing config (aliases → destination mappings).
# `id` bound via dashboard / Deploy button.
# ============================================================================
[[kv_namespaces]]
binding = "KV"

# ============================================================================
# Outbound email binding. Two backends share the same `EMAIL` binding name
# and JS API:
#   - Email Routing (default): only delivers to addresses verified as
#     Email Routing destinations on this account. Free.
#   - Email Service "Email Sending" (uncomment `remote = true`): delivers to
#     any recipient. Requires the sending domain onboarded to Email Service
#     and a paid Workers plan; billed per message.
# Switching only affects proxy-mode forwards, reverse-alias replies, and
# the queue retry/DLQ path — non-proxy synchronous forwards use
# `EmailMessage.forward()` and are unaffected.
# ============================================================================
[[send_email]]
name = "EMAIL"
# remote = true

# ============================================================================
# R2 bucket for raw email bytes: pending retries (`pending/<id>`) and
# Store action persistence (`messages/<id>`). Successful synchronous
# forwards do not touch R2.
# ============================================================================
[[r2_buckets]]
binding = "EMAILS"
bucket_name = "cutout-emails"

# ============================================================================
# Cloudflare Queues: retry pipeline for failed dispatches.
#  - `cutout-retries` carries `{id}` payloads pointing at a pending_dispatches
#    row; same script consumes it.
#  - `cutout-retries-dlq` receives messages that exhausted retries; the same
#    script's queue handler dispatches by queue name into the DLQ branch,
#    which sends an RFC 3464 DSN to the original sender and marks the row
#    dead-lettered.
# ============================================================================
[[queues.producers]]
binding = "RETRIES"
queue   = "cutout-retries"

[[queues.consumers]]
queue              = "cutout-retries"
max_batch_size     = 5
max_batch_timeout  = 10
max_retries        = 8
dead_letter_queue  = "cutout-retries-dlq"

[[queues.consumers]]
queue          = "cutout-retries-dlq"
max_batch_size = 5

# ============================================================================
# Analytics Engine dataset for aggregated stats (forwarded/dropped 7d,
# per-rule matches, top senders). Optional: if the dataset isn't created
# the worker silently skips writes and the dashboard hides stats.
# ============================================================================
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "cutout_events"

[vars]
ENVIRONMENT = "production"

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Per-deployment configuration
# ============================================================================
# All runtime vars and secrets are managed in the Cloudflare dashboard
# (Workers → cutout → Settings → Variables and Secrets) so this file stays
# portable for forks. Cloudflare Builds redeploys preserve them.
#
# Plain-text variables (Settings → Variables):
#   CF_ACCESS_TEAM    Cloudflare Access team name (e.g. "myteam")
#   CF_ACCESS_AUD     Application Audience (AUD) tag from Access app
#   CF_ACCOUNT_ID     Cloudflare account ID (for Analytics Engine SQL API
#                     and Browser Rendering REST calls). Empty disables both.
#   PUBLIC_BASE_URL   Public origin used for viewer links in Telegram/Discord
#                     posts (e.g. "https://cutout.example.com"). Empty
#                     suppresses the link.
#
# Secrets (Settings → Secrets):
#   CF_API_TOKEN      Cloudflare API token. "Account Analytics: Read" enables
#                     dashboard stats; "Browser Rendering: Edit" enables the
#                     in-chat screenshot for Telegram/Discord. Same token
#                     covers both. Empty disables both.
#   VIEWER_HMAC_KEY   Random 32+ bytes; signs public viewer URLs used by
#                     destinations configured with `link_auth = token`.
#                     Required only when at least one chat destination uses
#                     token link auth.
