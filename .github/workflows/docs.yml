name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # build.rs hashes public/app.js for the shell's integrity attributes, so
      # the frontend has to exist before the crate compiles at all -- including
      # a docs build, which never reaches rustdoc without it.
      - name: Build frontend (required by build.rs)
        run: npm ci && npm run build:frontend

      - name: Build API documentation
        run: cargo doc --no-deps

      - name: Assemble site
        run: |
          mkdir -p site
          cp doc/*.html doc/*.svg doc/*.css site/
          mv target/doc site/api

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
