name: CI

# Runs on every push and PR. Before this, the only workflow was `docs.yml`
# and wrangler's [build] command ran on Cloudflare's side, so a break surfaced
# at deploy time rather than on a PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Elm (format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: elm-format
        run: npx elm-format --validate frontend/src

      # --optimize is the gate that matters: it refuses any Debug.* call, so a
      # stray Debug.log can't reach production.
      - name: Build frontend
        run: npm run build:frontend

  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml already asks for stable + clippy, rustfmt and the
      # wasm32 target, so the action reads the channel from there.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # build.rs hashes public/app.js for the shell's integrity attributes, so
      # the frontend has to exist before the crate will compile at all.
      - name: Build frontend (required by build.rs)
        run: npm ci && npm run build:frontend

      - run: cargo fmt --check

      # Lint the target that actually ships. fmt, clippy and test are all
      # clean as of this commit, so every one of them gates.
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      - run: cargo test

  build:
    name: worker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The check that `cargo build` does not perform. worker-build is what
      # wrangler's [build] command invokes on deploy, and it refuses a crate
      # whose `worker` pin is older than itself — so this is the step that
      # catches a worker/worker-build mismatch on a PR rather than mid-deploy.
      # `scripts/build-worker.sh` also builds the Elm frontend first, mirroring
      # the deploy path exactly.
      - run: npm ci
      - run: cargo install -q worker-build --version ^0.8
      - run: ./scripts/build-worker.sh
